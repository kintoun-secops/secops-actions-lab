name: "01 - Ruff (format + lint + security)"

# 07-ci-summary.yml이 불러 쓰는 재사용 워크플로입니다.
#   workflow_call      다른 워크플로가 uses: 로 이 파일을 부를 수 있게 합니다.
#   workflow_dispatch  Actions 탭에서 이 도구 하나만 따로 돌려 볼 때 씁니다.
# pull_request·push·schedule은 07 한곳에만 둡니다. 여기에도 두면 같은 커밋에
# 체크가 두 벌 붙습니다.
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write   # reviewdog 인라인 코멘트용
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest
      # reviewdog의 github-pr-review 리포터는 'PR diff에 포함된 줄'에만 인라인
      # 코멘트를 답니다. main 푸시와 예약 실행에는 코멘트를 달 PR이 없어 건너뜁니다.
      # 재사용 워크플로 안에서도 github 컨텍스트는 부른 쪽(07)의 이벤트를 가리키므로,
      # 07이 pull_request로 시작한 실행에서만 이 조건이 참이 됩니다.
      # (reviewdog는 발견을 코멘트로 옮기기만 하고 종료 코드를 바꾸지 않습니다.)
      - name: Ruff lint -> reviewdog (PR 인라인 리뷰)
        if: github.event_name == 'pull_request'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run ruff check app/ --output-format=rdjson |
            reviewdog -f=rdjson -reporter=github-pr-review -level=warning
      # 포맷 게이트: 스타일이 어긋난 파일이 있으면 exit 1로 빨간불이 됩니다.
      # 결함 검출이 아니라 스타일 통일이 목적이라, diff와 이력을 깔끔하게 유지합니다.
      - name: Ruff format 검사 (스타일 게이트)
        run: uv run ruff format --check .
      # 린트 + 보안 게이트: 발견이 있으면 exit 1이 됩니다. 위 reviewdog 스텝이
      # 같은 검사를 이미 한 번 돌지만 그쪽은 코멘트만 남기므로, 머지를 막는
      # 스텝은 이렇게 따로 둡니다.
      # 앞의 포맷 검사가 먼저 실패해도 린트 결과를 함께 보여 주도록 always()로 실행합니다.
      - name: Ruff lint + security (머지 게이트)
        if: always()
        run: uv run ruff check app/
