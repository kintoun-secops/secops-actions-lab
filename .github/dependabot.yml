# Dependabot 설정 — 워크플로 스켈레톤과 달리 이 파일은 '완성본'입니다.
#
# 스켈레톤이 아닌 이유
#   Dependabot은 '기본 브랜치'의 이 설정만 읽습니다. 그리고 updates 항목이
#   비어 있으면 GitHub가 저장소에 config error 배너를 띄웁니다. 즉 스켈레톤으로
#   두면 '틀린 설정'이 되어 버립니다. 그래서 여기만 미리 채워 둡니다.
#   학습자의 과제는 이 파일을 '읽고', 실제로 열리는 봇 PR을 관찰하는 것입니다.
#   봇이 올린 PR도 다른 사람 PR과 똑같이 07-ci-summary의 관문을 통과해야 머지됩니다.
#
# 07의 예약 실행(주 1회)과 짝을 이룹니다. 예약 스캔은 "지금 쓰는 버전이
# 위험해졌다"를 pip-audit 빨간불로 알리고, Dependabot은 "올릴 버전이 나왔다"를
# PR로 가져옵니다. 둘 다 코드 변경 없이 CI 결과를 바꿉니다.
version: 2
updates:
  # (1) 파이썬 의존성. uv/pyproject.toml 프로젝트도 'pip' 생태계로 다룹니다.
  - package-ecosystem: "pip"
    directory: "/"            # pyproject.toml이 있는 루트를 감시합니다.
    schedule:
      interval: "weekly"      # 매주 갱신 PR을 확인합니다.

  # (2) GitHub Actions 자체의 버전 갱신을 감시합니다.
  #     README에서 언급하는 'SHA 핀' 관행과 직접 연결되는 항목입니다.
  #     (@v4 같은 메이저 태그 대신 커밋 SHA로 고정하면 공급망 관점에서 더 엄격합니다.)
  - package-ecosystem: "github-actions"
    directory: "/"            # .github/workflows/ 의 액션들을 감시합니다.
    schedule:
      interval: "weekly"
