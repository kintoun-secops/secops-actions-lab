name: "07 - CI summary (orchestrator)"

on:
  pull_request:

  push:
    branches: [main]

  schedule:
    - cron: "30 20 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      code: ${{ steps.filter.outputs.code || 'true' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

        run: |
          # schedule / 수동 실행은 항상 검사 대상으로 처리
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 비교할 기준 커밋이 없으면 안전하게 검사 실행
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD)

          echo "바뀐 파일"
          echo "$changed"

          # 문서 및 정답 폴더는 코드 변경에서 제외
          code_changed=$(echo "$changed" | grep -Ev '\.md$|^LICENSE$|^\.gitignore$|^_solution/' || true)

          if [ -n "$code_changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ruff:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/01-ruff.yml
    permissions:
      contents: read
      pull-requests: write

  mypy:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/02-mypy.yml
    permissions:
      contents: read

  pytest:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/03-pytest.yml
    permissions:
      contents: read
      pull-requests: write

  pip-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/04-pip-audit.yml
    permissions:
      contents: read

  semgrep:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/05-semgrep.yml
    permissions:
      contents: read
      security-events: write

  gitleaks:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'schedule'
    uses: ./.github/workflows/06-gitleaks.yml
    permissions:
      contents: read
    secrets: inherit

  summary:
    runs-on: ubuntu-latest
    needs: [changes, ruff, mypy, pytest, pip-audit, semgrep, gitleaks]

    if: always()

    permissions: {}

    steps:
      - name: 결과 표를 잡 요약에 기록
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          RUFF: ${{ needs.ruff.result }}
          MYPY: ${{ needs.mypy.result }}
          PYTEST: ${{ needs.pytest.result }}
          PIP_AUDIT: ${{ needs['pip-audit'].result }}
          SEMGREP: ${{ needs.semgrep.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}

        run: |
          fail=0

          row() {
            local label="$1" result="$2" owner="$3" mark

            case "$result" in
              success)
                mark="통과"
                ;;
              skipped)
                mark="건너뜀"
                ;;
              cancelled)
                mark="취소"
                fail=1
                ;;
              *)
                mark="실패"
                fail=1
                ;;
            esac

            printf '| %s | %s | %s |\n' "$label" "$mark" "$owner"
          }

          {
            echo "## 보안 CI 요약"
            echo ""
            echo "이벤트 \`${GITHUB_EVENT_NAME}\` · 대상 \`${GITHUB_REF_NAME}\`"
            echo ""

            echo "| 도구 | 결과 | 담당 파일 |"
            echo "|---|---|---|"

            row "Ruff (format + lint + S)" \
              "$RUFF" \
              "messy_format / lint_playground / insecure_hash / shell_injection / unsafe_pickle / sqli_fstring"

            row "mypy" \
              "$MYPY" \
              "type_confusion.py"

            row "pytest" \
              "$PYTEST" \
              "price_logic.py"

            row "pip-audit" \
              "$PIP_AUDIT" \
              "uv.lock (전이 의존성 포함)"

            row "Semgrep (taint)" \
              "$SEMGREP" \
              "sqli_taint_only.py"

            row "gitleaks" \
              "$GITLEAKS" \
              "leaky_settings.py / deploy/fake_deploy_key.pem"

            echo ""

            if [ "$CODE" = "false" ]; then
              echo "문서만 바뀐 변경이라 도구 잡은 돌지 않았습니다. 마크다운과 LICENSE, .gitignore, _solution/ 은 검사 대상 코드가 아닙니다."
            else
              echo "'건너뜀'은 이 이벤트에서 돌지 않도록 설계된 잡입니다. 예약 실행에서는 pip-audit과 Semgrep만 돕니다."
            fi

          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$CHANGES" != "success" ]; then
            echo "변경 판정 잡(changes)이 정상 종료되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "실패한 체크가 있어 이 요약도 실패로 끝납니다." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi