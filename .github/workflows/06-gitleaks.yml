name: "06 - gitleaks (secret scanning)"

# 07-ci-summary.yml이 불러 쓰는 재사용 워크플로입니다. workflow_dispatch는
# 이 도구 하나만 따로 돌려 보고 싶을 때를 위해 남겨 둡니다.
# 문서: https://docs.github.com/actions/sharing-automations/reusing-workflows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 전체 Git 히스토리를 받아 과거 커밋의 시크릿까지 검사
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2