      # app/ 디렉터리를 mypy로 정적 타입 검사하는 스텝을 완성하세요.
      # 설정(python_version 등)은 pyproject.toml의 [tool.mypy]가 이미 하고 있습니다.
      # 힌트: `uv run <도구> <경로>` 형태입니다.
      # 문서: https://mypy.readthedocs.io/en/stable/command_line.html
      # 성공 기준: type_confusion.py에서 반환 타입 오류(return-value)와
      #            인자 타입 오류(arg-type) 2건이 뜨고 '빨간불'이 되면 됩니다.
      # ─────────────────────────────────────────────────────
