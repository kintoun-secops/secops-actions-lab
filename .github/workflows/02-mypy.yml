name: "02 - mypy (static types)"

# 07-ci-summary.yml이 불러 쓰는 재사용 워크플로입니다. workflow_dispatch는
# 이 도구 하나만 따로 돌려 보고 싶을 때를 위해 남겨 둡니다.
# 문서: https://docs.github.com/actions/sharing-automations/reusing-workflows
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
