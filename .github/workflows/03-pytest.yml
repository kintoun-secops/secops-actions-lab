name: "03 - pytest (regression tests)"

# 07-ci-summary.yml이 불러 쓰는 재사용 워크플로입니다. workflow_dispatch는
# 이 도구 하나만 따로 돌려 보고 싶을 때를 위해 남겨 둡니다.
# 문서: https://docs.github.com/actions/sharing-automations/reusing-workflows
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write   # 커버리지 스티키 코멘트용

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - run: uv sync --frozen

      # ── TODO (도구 실행) ─────────────────────────────────
      # pytest로 테스트를 실행하고 커버리지 리포트를 만드는 스텝을 완성하세요.
      # 커버리지 코멘트 액션은 junit xml + coverage xml 두 파일을 입력으로 받습니다.
      # ─────────────────────────────────────────────────────
      - name: pytest (+커버리지 리포트, 머지 게이트)
        run: uv run pytest --cov=app --junitxml=pytest.xml --cov-report=xml

      # ── TODO (이벤트 분기) ───────────────────────────────
      # 테스트가 실패해도 PR이면 커버리지 코멘트를 남깁니다.
      # ─────────────────────────────────────────────────────
      - name: 커버리지 스티키 코멘트
        if: always() && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml